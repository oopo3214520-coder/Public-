<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悅管家租賃管理系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');

  :root {
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --surface2: #F1EEE6;
    --border: #E3DFD3;
    --primary: #17324E;
    --primary-light: #EAF0F4;
    --primary-dark: #0E2136;
    --gold: #B8863B;
    --gold-light: #FAF3E5;
    --accent: #1D7A9C;
    --success: #2E7D5B;
    --success-light: #EAF5EF;
    --warning: #B4791E;
    --warning-light: #FBF2E1;
    --danger: #AE3A2E;
    --danger-light: #FAEAE7;
    --text: #1C2024;
    --text2: #3D4349;
    --text3: #6B7178;
    --text4: #9CA1A8;
    --shadow: 0 1px 2px rgba(23,29,35,0.05), 0 4px 14px -6px rgba(23,29,35,0.10);
    --shadow-md: 0 10px 28px -8px rgba(23,29,35,0.20);
    --radius: 14px;
    --radius-sm: 10px;
    --font-head: 'Noto Serif TC', 'PingFang TC', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font-family: inherit; }

  ::selection { background: var(--gold-light); color: var(--primary-dark); }

  button:focus-visible, .form-input:focus-visible, a:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }

  /* ── Sidebar ── */
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 224px; background: var(--primary);
    border-right: none;
    display: flex; flex-direction: column;
    z-index: 100; box-shadow: var(--shadow-md);
  }
  .sidebar-logo { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .sidebar-logo h1 { font-family: var(--font-head); font-size: 16px; font-weight: 700; color: #fff; line-height: 1.4; letter-spacing: 0.01em; }
  .sidebar-logo span { font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 400; letter-spacing: 0.03em; }
  .sidebar-nav { padding: 14px 0; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 20px; cursor: pointer;
    font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.68);
    transition: all 0.15s; border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,0.09); color: #fff; border-left-color: var(--gold); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 12px; color: rgba(255,255,255,0.45); }

  /* ── Main ── */
  .main { margin-left: 224px; padding: 28px; min-height: 100vh; }
  .page { display: none; }
  .page.active { display: block; }

  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .page-title { font-family: var(--font-head); font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: 0.01em; }
  .page-subtitle { font-size: 13px; color: var(--text3); margin-top: 2px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; cursor: pointer;
    border: none; transition: all 0.15s;
  }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 2px rgba(23,50,78,0.2); }
  .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 2px 6px rgba(23,50,78,0.28); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-secondary:active { transform: translateY(1px); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-xs { padding: 4px 9px; font-size: 11px; }
  .btn-danger { background: var(--danger-light); color: var(--danger); }
  .btn-danger:hover { background: #FECACA; }
  .btn-success { background: var(--success-light); color: var(--success); }

  /* ── Stat Cards ── */
  .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border-radius: var(--radius); padding: 18px 20px;
    box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; overflow: hidden;
    cursor: pointer; transition: all 0.15s;
  }
  .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .stat-card.blue::before { background: var(--primary); }
  .stat-card.green::before { background: var(--success); }
  .stat-card.amber::before { background: var(--warning); }
  .stat-card.sky::before { background: var(--accent); }
  .stat-card.red::before { background: var(--danger); }
  .stat-label { font-size: 12px; color: var(--text3); font-weight: 500; margin-bottom: 8px; }
  .stat-value { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; font-variant-numeric: tabular-nums; }
  .stat-value.small { font-size: 20px; }
  .stat-sub { font-size: 11px; color: var(--text4); margin-top: 6px; }
  .stat-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 28px; opacity: 0.12; }

  .section-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section-title span { font-size: 12px; color: var(--text3); font-weight: 400; }
  .properties-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .prop-card {
    background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
    box-shadow: var(--shadow); overflow: hidden; transition: all 0.2s;
  }
  .prop-card:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }
  .prop-card-header {
    padding: 16px 18px 12px; border-bottom: 1px solid var(--surface2);
    display: flex; align-items: flex-start; justify-content: space-between; cursor: pointer;
  }
  .prop-name { font-family: var(--font-head); font-size: 16px; font-weight: 700; color: var(--text); }
  .prop-address { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .badge { font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 20px; white-space: nowrap; }
  .badge-renew { background: #DCFCE7; color: var(--success); }
  .badge-new { background: #FEE2E2; color: var(--danger); }
  .badge-expire { background: #FEE2E2; color: var(--danger); }
  .badge-vacant { background: #F3E8FF; color: #7E22CE; }
  .badge-dealtype { background: var(--surface2); color: var(--text2); font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; border: 1px solid var(--border); }
  .idle-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--surface2); }
  .idle-item:last-child { border-bottom: none; padding-bottom: 0; }
  .idle-days { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .idle-ok { background: var(--success-light); color: var(--success); }
  .idle-warn { background: #FEF9C3; color: #854D0E; }
  .idle-bad { background: var(--danger-light); color: var(--danger); }
  .prop-card-body { padding: 14px 18px; cursor: pointer; }
  .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .prop-row:last-child { margin-bottom: 0; }
  .prop-key { color: var(--text3); }
  .prop-val { color: var(--text2); font-weight: 500; }
  .prop-val.money { color: var(--primary); font-weight: 700; font-variant-numeric: tabular-nums; }
  .prop-card-footer { padding: 10px 18px; background: var(--surface2); display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border); }

  .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .alert-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 18px 20px; }
  .alert-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--surface2); }
  .alert-item:last-child { border-bottom: none; padding-bottom: 0; }
  .alert-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .alert-dot.red { background: var(--danger); }
  .alert-dot.amber { background: var(--warning); }
  .alert-dot.blue { background: var(--primary); }
  .alert-text { font-size: 13px; color: var(--text2); line-height: 1.5; }
  .alert-time { font-size: 11px; color: var(--text4); margin-top: 2px; }

  .record-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--surface2); }
  .record-item:last-child { border-bottom: none; }
  .record-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .record-icon.rent { background: var(--primary-light); }
  .record-icon.repair { background: #FEF3C7; }
  .record-icon.todo { background: var(--success-light); }
  .record-body { flex: 1; }
  .record-title { font-size: 13px; font-weight: 600; color: var(--text2); }
  .record-desc { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .record-amount { font-size: 14px; font-weight: 700; color: var(--primary); }

  .detail-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; cursor: pointer; background: var(--surface2); color: var(--text2); border: none; transition: all 0.15s;
  }
  .back-btn:hover { background: var(--border); }
  .detail-title { font-family: var(--font-head); font-size: 21px; font-weight: 700; }
  .detail-header-spacer { flex: 1; }

  .tabs { display: flex; gap: 2px; background: var(--surface2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 20px; width: fit-content; }
  .tab { padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--text3); cursor: pointer; border: none; background: none; transition: all 0.15s; }
  .tab.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }
  .tab:hover:not(.active) { color: var(--text2); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .info-box { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 20px; }
  .info-box h3 { font-size: 13px; font-weight: 700; color: var(--text3); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
  .info-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--surface2); font-size: 13px; }
  .info-row:last-child { border-bottom: none; padding-bottom: 0; }
  .info-key { color: var(--text3); }
  .info-val { color: var(--text2); font-weight: 600; }
  .info-val.big { font-size: 18px; color: var(--primary); font-variant-numeric: tabular-nums; }

  .table-wrap { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; }
  .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .table-header-title { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 11px 16px; font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; background: var(--surface2); border-bottom: 1px solid var(--border); }
  td { padding: 12px 16px; font-size: 13px; color: var(--text2); border-bottom: 1px solid var(--surface2); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--primary-light); }
  .status-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .status-paid { background: var(--success-light); color: var(--success); }
  .status-pending { background: #FEF9C3; color: #854D0E; }
  .status-done { background: var(--success-light); color: var(--success); }
  .status-progress { background: #DBEAFE; color: var(--primary); }
  .status-open { background: #FEE2E2; color: var(--danger); }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--text4); font-size: 14px; padding: 4px 6px; border-radius: 6px; transition: all 0.15s; }
  .del-btn:hover { background: var(--danger-light); color: var(--danger); }
  .edit-icon-btn { background: none; border: none; cursor: pointer; color: var(--text4); font-size: 14px; padding: 4px 6px; border-radius: 6px; transition: all 0.15s; }
  .edit-icon-btn:hover { background: var(--primary-light); color: var(--primary); }

  .todo-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--surface2); background: var(--surface); }
  .todo-item:last-child { border-bottom: none; }
  .todo-check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-size: 10px; }
  .todo-check.done { background: var(--success); border-color: var(--success); color: #fff; }
  .todo-text { flex: 1; font-size: 13px; color: var(--text2); }
  .todo-text.done { text-decoration: line-through; color: var(--text4); }
  .todo-priority { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
  .priority-high { background: #FEE2E2; color: var(--danger); }
  .priority-mid { background: #FEF9C3; color: #854D0E; }
  .priority-low { background: var(--success-light); color: var(--success); }

  .report-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .report-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 16px 18px; text-align: center; }
  .report-val { font-size: 22px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .report-label { font-size: 12px; color: var(--text3); margin-top: 4px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--text3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius); width: 520px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-family: var(--font-head); font-size: 17px; font-weight: 700; }
  .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text3); }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: space-between; align-items: center; }
  .modal-footer-right { display: flex; gap: 10px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; }
  .form-input { width: 100%; padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 13px; color: var(--text); background: var(--bg); transition: border 0.15s; font-family: inherit; }
  .form-input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-light); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-section { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin: 20px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .form-section:first-child { margin-top: 0; }

  .prop-group-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: var(--surface2); border-bottom: 1px solid var(--border);
  }
  .prop-group-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .prop-group-tenant { font-size: 12px; color: var(--text3); font-weight: 400; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 1100px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px) {
    .sidebar { width: 60px; }
    .sidebar-logo h1, .sidebar-logo span, .nav-item span, .sidebar-footer { display: none; }
    .main { margin-left: 60px; }
    .nav-item { justify-content: center; padding: 12px; }
    .bottom-grid { grid-template-columns: 1fr; }
    .info-grid { grid-template-columns: 1fr; }
  }

  /* ══════════ MOBILE (≤640px): bottom nav, stacked layouts ══════════ */
  @media (max-width: 640px) {
    .sidebar {
      width: 100%; height: 60px; top: auto; bottom: 0; left: 0; right: 0;
      flex-direction: row; border-right: none; border-top: 1px solid var(--border);
    }
    .sidebar-logo, .sidebar-footer { display: none; }
    .sidebar-nav { display: flex; flex-direction: row; padding: 0; width: 100%; }
    .nav-item {
      flex: 1; flex-direction: column; justify-content: center; align-items: center;
      gap: 3px; padding: 6px 2px; border-left: none; border-top: 3px solid transparent;
      font-size: 10px; white-space: nowrap;
    }
    .nav-item.active { border-left: none; border-top-color: var(--primary); }
    .nav-item span:last-child { display: block !important; font-size: 10px; }
    .nav-icon { font-size: 18px; width: auto; }

    .main { margin-left: 0; padding: 14px 12px 76px; }

    .page-header { flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .page-title { font-size: 19px; }
    .page-header .btn { font-size: 13px; padding: 8px 14px; }

    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat-card { padding: 14px 14px; }
    .stat-value { font-size: 20px; }
    .stat-value.small { font-size: 16px; }
    .stat-icon { font-size: 22px; }

    .properties-grid { grid-template-columns: 1fr; gap: 12px; }

    .bottom-grid { gap: 12px; margin-bottom: 18px; }
    .alert-card { padding: 14px 16px; }

    /* Tables: allow horizontal scroll instead of squishing */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: 640px; }
    .table-header { flex-wrap: wrap; gap: 8px; padding: 14px 16px; }

    .prop-group-header { flex-wrap: wrap; gap: 8px; }

    /* Detail page header */
    .detail-header { flex-wrap: wrap; row-gap: 10px; }
    .detail-header .back-btn { order: 1; }
    .detail-title { font-size: 17px; }
    #detail-addr { font-size: 12px !important; }
    .detail-header-spacer { display: none; }
    .detail-header { gap: 8px; }
    .detail-header > button.btn-sm { font-size: 12px; padding: 6px 10px; }

    /* Tabs: horizontal scroll instead of overflow/wrap */
    .tabs { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; }
    .tab { white-space: nowrap; padding: 8px 13px; font-size: 12px; flex-shrink: 0; }

    .info-grid { gap: 12px; }
    .info-box { padding: 16px; }

    .report-summary { grid-template-columns: 1fr; gap: 10px; }

    /* Modal: fit small screens */
    .modal-overlay { align-items: flex-end; }
    .modal { width: 100%; max-width: 100%; max-height: 90vh; border-radius: var(--radius) var(--radius) 0 0; }
    .modal-header { padding: 16px 18px; }
    .modal-body { padding: 18px; }
    .modal-footer { padding: 12px 18px; flex-wrap: wrap; }
    .form-row { grid-template-columns: 1fr; gap: 0; }
    .form-input { font-size: 16px; } /* prevents iOS auto-zoom on focus */

    .todo-item { padding: 12px; flex-wrap: wrap; }
    .todo-text { font-size: 13px; }
  }
</style>
</head>
<body>

<div id="loading-overlay" style="position:fixed;inset:0;background:#F7F8FA;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
  <div style="font-size:32px;">🏢</div>
  <div style="font-size:14px;color:#6B7280;">載入中，正在連接雲端資料庫…</div>
</div>


<aside class="sidebar">
  <div class="sidebar-logo">
    <h1>🏢 悅管家<br>租賃管理系統</h1>
    <span>專業版 v2.1</span>
  </div>
  <nav class="sidebar-nav">

// ═══════════════════════════════ HELPERS ═══════════════════════════════
function statusLabel(s){ return { renew:'續約', new:'新簽約', expire:'即將到期', vacant:'待租' }[s] || s; }
function dealTypeLabel(t){ return { lease:'包租', management:'代管' }[t] || '未設定'; }
function statusClass(s){ return { renew:'badge-renew', new:'badge-new', expire:'badge-expire', vacant:'badge-vacant' }[s] || ''; }
function idleDays(p){
  if(!p.vacantSince) return null;
  const start = new Date(p.vacantSince);
  if(isNaN(start)) return null;
  const diff = Math.floor((new Date() - start) / (1000*60*60*24));
  return diff >= 0 ? diff : 0;
}
function fmtMoney(v){ return v != null && v !== '' ? '$'+Number(v).toLocaleString() : null; }
function fmtStatus(s){
  const map = { paid:['status-paid','已收款'], pending:['status-pending','待確認'], done:['status-done','已完成'], progress:['status-progress','處理中'], open:['status-open','待處理'] };
  const d = map[s] || ['','—'];
  return `<span class="status-badge ${d[0]}">${d[1]}</span>`;
}
function priorityClass(p){ return { '緊急':'priority-high', '一般':'priority-mid', '低':'priority-low' }[p] || 'priority-mid'; }
function getProp(id){ return properties.find(p => p.id === id); }
function yearTotal(p){
  const sf = p.serviceFee || 0;
  return p.rent * 12 + sf;
}
function esc(s){ return (s==null?'':String(s)).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══════════════════════════════ RENDER: STATS ═══════════════════════════════
function renderStats(){
  const totalProps = properties.length;
  const totalRent = properties.reduce((a,p)=>a+p.rent,0);
  const totalYear = properties.reduce((a,p)=>a+yearTotal(p),0);
  let missingCount = 0;
  properties.forEach(p=>{
    if(!p.serviceFee) missingCount++;
    if(!p.bank) missingCount++;
  });
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card blue" onclick="openStatModal('properties')"><div class="stat-label">管理物件總數</div><div class="stat-value">${totalProps}</div><div class="stat-sub">全部出租中</div><span class="stat-icon">🏢</span></div>
    <div class="stat-card green" onclick="openStatModal('rent')"><div class="stat-label">本月總租金收入</div><div class="stat-value small">$${totalRent.toLocaleString()}</div><div class="stat-sub">${totalProps} 間合計</div><span class="stat-icon">💰</span></div>
    <div class="stat-card sky" onclick="openStatModal('year')"><div class="stat-label">預估年度總收入</div><div class="stat-value small">$${totalYear.toLocaleString()}</div><div class="stat-sub">含半個月服務費</div><span class="stat-icon">📊</span></div>
    <div class="stat-card amber" onclick="openStatModal('missing')"><div class="stat-label">待收 / 待填項目</div><div class="stat-value">${missingCount} 項</div><div class="stat-sub">需補齊資料</div><span class="stat-icon">⚠️</span></div>
    <div class="stat-card red" onclick="openStatModal('vacant')"><div class="stat-label">待租閒置物件</div><div class="stat-value">${properties.filter(p=>p.status==='vacant').length} 間</div><div class="stat-sub">${(()=>{const vp=properties.filter(p=>p.status==='vacant'&&idleDays(p)!=null);if(!vp.length)return'目前無資料';const max=Math.max(...vp.map(idleDays));return '最長閒置 '+max+' 天';})()}</div><span class="stat-icon">🔑</span></div>`;
}

// ═══════════════════════════════ RENDER: PROPERTY CARDS ═══════════════════════════════
function propCardHTML(p){
  return `
    <div class="prop-card">
      <div class="prop-card-header" onclick="openDetail(${p.id})">
        <div><div class="prop-name">${esc(p.name)}</div><div class="prop-address">${esc(p.address)}</div></div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
          <span class="badge ${statusClass(p.status)}">${statusLabel(p.status)}</span>
          <span class="badge-dealtype">${dealTypeLabel(p.dealType)}</span>
        </div>
      </div>
      <div class="prop-card-body" onclick="openDetail(${p.id})">
        <div class="prop-row"><span class="prop-key">👤 承租人</span><span class="prop-val">${esc(p.tenant)||'—'}</span></div>
        <div class="prop-row"><span class="prop-key">📅 租期</span><span class="prop-val">${p.periodStart}-${p.periodEnd}</span></div>
        <div class="prop-row"><span class="prop-key">🗓️ 收訂日期</span><span class="prop-val">${esc(p.depositDate)||'—'}</span></div>
        <div class="prop-row"><span class="prop-key">💰 月租金</span><span class="prop-val money">$${p.rent.toLocaleString()}</span></div>
        <div class="prop-row"><span class="prop-key">🧾 半個月服務費</span><span class="prop-val">${fmtMoney(p.serviceFee) || '<span style="color:var(--warning)">待填</span>'}</span></div>
        <div class="prop-row"><span class="prop-key">🏦 銀行</span><span class="prop-val">${esc(p.bank)||'<span style="color:var(--warning)">待填</span>'}</span></div>
      </div>
      <div class="prop-card-footer">
        <button class="btn btn-secondary btn-sm" onclick="openDetail(${p.id})">詳情</button>
        <button class="btn btn-secondary btn-sm" onclick="openPropertyModal(${p.id})">✅ 編輯</button>
        <button class="btn btn-danger btn-sm" onclick="deleteProperty(${p.id})">❎ 刪除</button>
      </div>
    </div>`;
}
function renderAllCards(){
  const html = properties.length ? properties.map(propCardHTML).join('') :
    `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🏠</div><div class="empty-text">還沒有房屋資訊<br>點擊「新增房屋」按鈕開始建立</div></div>`;

}

// ═══════════════════════════════ RENDER: ALERTS & RECENT ═══════════════════════════════
function renderAlerts(){
  let alerts = [];
  properties.forEach(p=>{
    if(!p.serviceFee) alerts.push({dot:'amber', text:`${p.name} — 半個月服務費尚未填寫`, time:`承租人：${p.tenant||'—'}`});

  });
  const list = document.getElementById('alert-list');
  list.innerHTML = alerts.length ? alerts.map(a=>`
    <div class="alert-item"><div class="alert-dot ${a.dot}"></div><div><div class="alert-text">${esc(a.text)}</div><div class="alert-time">${esc(a.time)}</div></div></div>
  `).join('') : `<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">目前沒有需要注意的警告</div></div>`;
}
function renderRecent(){
  let items = [];
  properties.forEach(p=>{
    p.rentRecords.slice(0,1).forEach(r=>items.push({icon:'rent',emoji:'💰',title:`${p.name} — ${r.month}租金`,desc:`${p.tenant} · ${r.status==='paid'?'已收款':'待確認'}`,amount:'$'+r.rent.toLocaleString(),color:'var(--primary)'}));
    p.repairRecords.slice(0,1).forEach(r=>items.push({icon:'repair',emoji:'🔧',title:`${p.name} — ${r.item}`,desc:`${r.reported} ${r.status==='done'?'完成':'處理中'}`,amount:r.status==='done'?'完成':'處理中',color:r.status==='done'?'var(--success)':'var(--warning)'}));
  });
  document.getElementById('recent-list').innerHTML = items.length ? items.slice(0,6).map(i=>`
    <div class="record-item">
      <div class="record-icon ${i.icon}">${i.emoji}</div>
      <div class="record-body"><div class="record-title">${esc(i.title)}</div><div class="record-desc">${esc(i.desc)}</div></div>
      <div class="record-amount" style="color:${i.color}">${i.amount}</div>
    </div>`).join('') : `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">尚無紀錄</div></div>`;
}

// ═══════════════════════════════ RENDER: VACANT PROPERTIES ═══════════════════════════════
function renderVacant(){
  const vacantProps = properties.filter(p => p.status === 'vacant');
  const card = document.getElementById('vacant-card');
  const list = document.getElementById('vacant-list');
  if(!vacantProps.length){
    list.innerHTML = `<div class="empty" style="padding:20px"><div class="empty-icon">🔑</div><div class="empty-text">目前沒有待租物件，全部已出租 🎉</div></div>`;
    return;
  }
  list.innerHTML = vacantProps.map(p=>{
    const days = idleDays(p);
    let cls = 'idle-ok', label = days==null ? '未設定日期' : `閒置 ${days} 天`;
    if(days!=null){
      if(days >= 60) cls = 'idle-bad';
      else if(days >= 30) cls = 'idle-warn';
      else cls = 'idle-ok';
    } else { cls = 'idle-warn'; }
    return `
      <div class="idle-item">
        <div>
          <div style="font-weight:700;font-size:14px">${esc(p.name)}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">${esc(p.address)} ${p.vacantSince ? '· 閒置起始 '+p.vacantSince : ''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="idle-days ${cls}">${label}</span>
          <button class="btn btn-secondary btn-xs" onclick="openDetail(${p.id})">詳情</button>
        </div>
      </div>`;
  }).join('');
}

// ═══════════════════════════════ MONTHLY REPORT: CALCULATIONS ═══════════════════════════════
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function getReport(id){ return monthlyReports.find(r => r.id === id); }
function getStaff(report, staffId){ return report.staff.find(s => s.id === staffId); }
function staffTotal(staff){ return round2(staff.items.reduce((a,i)=>a+(Number(i.amount)||0),0)); }
function staffInsurance(total){ return total >= 20000 ? round2(total * 0.0211) : 0; }
function staffTax(total){ return total >= 20000 ? round2(total * 0.10) : 0; }
function staffNet(total){ return round2(total - staffInsurance(total) - staffTax(total)); }
function fmtNum(n){ return (n<0?'-':'') + '$' + Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2}); }

// ═══════════════════════════════ MONTHLY REPORT: RENDER ═══════════════════════════════
function renderReportPage(){
  const tabsWrap = document.getElementById('report-month-tabs');

    return;
  }
  if(currentReportId == null || !getReport(currentReportId)){
    currentReportId = monthlyReports[monthlyReports.length-1].id;
  }

  const sortedReports = [...monthlyReports].sort((a,b)=> a.month.localeCompare(b.month));
  tabsWrap.innerHTML = sortedReports.map(r=>`

  const report = getReport(currentReportId);
  const allTotals = report.staff.map(s=>{
    const total = staffTotal(s);
    return { insurance: staffInsurance(total), tax: staffTax(total), net: staffNet(total) };
  });
  const sumInsurance = round2(allTotals.reduce((a,t)=>a+t.insurance,0));

      <div class="report-card"><div class="report-val" style="color:var(--success)">${fmtNum(sumNet)}</div><div class="report-label">總獎金支出（實領總和）</div></div>

        <tbody>
          ${report.staff.length ? report.staff.map(s=>{
            const total = staffTotal(s);
            return `<tr style="cursor:pointer" onclick="document.getElementById('staff-card-${s.id}').scrollIntoView({behavior:'smooth',block:'start'})">

              <td style="font-weight:700;color:var(--success)">${fmtNum(staffNet(total))}</td>
            </tr>`;
          }).join('') : `<tr><td colspan="5"><div class="empty"><div class="empty-text">本月尚無員工資料</div></div></td></tr>`}
        </tbody>
      </table>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin:14px 0;">
      <button class="btn btn-secondary btn-sm" onclick="openStaffNameModal(${report.id})">＋ 新增員工</button>
      <button class="btn btn-danger btn-sm" onclick="deleteReportMonth(${report.id})">❎ 刪除本月報表</button>
    </div>
    ${report.staff.length ? report.staff.map(s=>{
      const total = staffTotal(s);
      const insurance = staffInsurance(total);
      const tax = staffTax(total);
      const net = staffNet(total);
      return `

        <div class="prop-group-header">

function refreshAll(){
  renderStats();

  renderRecent();
  const activePage = document.querySelector('.page.active').id.replace('page-','');
  if(activePage==='rent') renderRentPage();

}

// ═══════════════════════════════ CLOUD SYNC (Upstash via /api/data) ═══════════════════════════════
let saveTimer = null;
function setSyncStatus(text, isError){
  const el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? '#DC2626' : '';
}
function persistData(){
  clearTimeout(saveTimer);
  setSyncStatus('● 儲存中…');
  saveTimer = setTimeout(async () => {
    try{
      const resp = await fetch('/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ properties, nextPropId, monthlyReports, nextReportId, nextStaffId, nextItemId })
      });
      if(!resp.ok){
        const err = await resp.json().catch(()=>({}));
        throw new Error(err.error || ('HTTP ' + resp.status));
      }
      setSyncStatus('● 已同步雲端');
    }catch(e){
      console.error('儲存失敗', e);
      setSyncStatus('⚠ 儲存失敗（請檢查網路或設定）', true);
    }
  }, 500);
}
async function loadData(){
  const loadingEl = document.getElementById('loading-overlay');
  try{
    setSyncStatus('● 讀取雲端資料中…');
    const resp = await fetch('/api/data');
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error || ('HTTP ' + resp.status));
    }
    const data = await resp.json();
    if(data && Array.isArray(data.properties) && data.properties.length){
      properties = data.properties;
      nextPropId = data.nextPropId || (Math.max(...properties.map(p=>p.id)) + 1);
      monthlyReports = Array.isArray(data.monthlyReports) ? data.monthlyReports : [];
      nextReportId = data.nextReportId || (monthlyReports.length ? Math.max(...monthlyReports.map(r=>r.id))+1 : 1);
      nextStaffId = data.nextStaffId || 1;
      nextItemId = data.nextItemId || 1;
      setSyncStatus('● 已同步雲端');
    } else {
      // Redis 裡還沒有資料 → 用預設範例資料當作第一次的初始值，並寫回雲端
      setSyncStatus('● 初始化雲端資料…');
      persistData();
    }
  }catch(e){
    console.error('載入失敗，改用預設資料顯示', e);
    setSyncStatus('⚠ 無法連線雲端，暫時顯示本機資料（重新整理可能會消失）', true);
  }
  if(loadingEl) loadingEl.style.display = 'none';
  renderStats(); renderAllCards(); renderVacant(); renderAlerts(); renderRecent();
  const activePage = document.querySelector('.page.active').id.replace('page-','');
  if(activePage==='rent') renderRentPage();
  if(activePage==='repair') renderRepairPage();
  if(activePage==='todo') renderTodoPage();
  if(activePage==='detail' && currentPropId) renderDetail();
  if(activePage==='report') renderReportPage();
}

function openStatModal(type){
  document.getElementById('modal-save-btn').style.display = 'none';
  document.getElementById('modal-cancel-btn').textContent = '關閉';
  document.getElementById('modal-footer-left').innerHTML = '';
  let title = '', bodyHtml = '';

  const rowHtml = (p, rightHtml) => `
    <div class="idle-item" style="cursor:pointer" onclick="closeModal();openDetail(${p.id})">
      <div>
        <div style="font-weight:700;font-size:14px">${esc(p.name)}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">${esc(p.address)} ${p.tenant?'· 承租人：'+esc(p.tenant):''}</div>
      </div>
      ${rightHtml}
    </div>`;

  if(type === 'properties'){
    title = '🏢 管理物件總數 — 全部物件';
    bodyHtml = properties.length ? properties.map(p => rowHtml(p, `<span class="badge ${statusClass(p.status)}">${statusLabel(p.status)}</span>`)).join('') :
      `<div class="empty"><div class="empty-text">尚無物件資料</div></div>`;
  }
  else if(type === 'rent'){
    title = '💰 本月總租金收入 — 各物件明細';
    bodyHtml = properties.length ? properties.map(p => rowHtml(p, `<span style="font-weight:700;color:var(--primary)">$${p.rent.toLocaleString()}</span>`)).join('') :
      `<div class="empty"><div class="empty-text">尚無物件資料</div></div>`;
  }
  else if(type === 'year'){
    title = '📊 預估年度總收入 — 各物件明細';
    bodyHtml = properties.length ? properties.map(p => rowHtml(p, `<span style="font-weight:700;color:var(--accent)">$${yearTotal(p).toLocaleString()}</span>`)).join('') :
      `<div class="empty"><div class="empty-text">尚無物件資料</div></div>`;
  }
  else if(type === 'missing'){
    title = '⚠️ 待收 / 待填項目';
    let items = [];
    properties.forEach(p=>{
      if(!p.serviceFee) items.push(rowHtml(p, `<span style="color:var(--warning);font-size:12px;font-weight:600">半個月服務費未填</span>`));
      if(!p.bank || !p.account) items.push(rowHtml(p, `<span style="color:var(--warning);font-size:12px;font-weight:600">銀行帳號未填</span>`));
    });
    bodyHtml = items.length ? items.join('') : `<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">目前沒有待補齊的項目</div></div>`;
  }
  else if(type === 'vacant'){
    title = '🔑 待租閒置物件';
    const vp = properties.filter(p => p.status === 'vacant');
    bodyHtml = vp.length ? vp.map(p=>{
      const days = idleDays(p);
      const label = days==null ? '未設定日期' : `閒置 ${days} 天`;
      return rowHtml(p, `<span style="font-weight:700;color:var(--danger)">${label}</span>`);
    }).join('') : `<div class="empty"><div class="empty-icon">🎉</div><div class="empty-text">目前沒有待租物件，全部已出租</div></div>`;
  }

  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-overlay').classList.add('open');
}

// ═══════════════════════════════ MODAL: CLOSE / SAVE ═══════════════════════════════
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }

function saveModal(){
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

  if(modalCtx.type === 'addProperty' || modalCtx.type === 'editProperty'){
    const name = v('pf-name');
    if(!name){ alert('請輸入物件名稱'); return; }
    const data = {
      name, address: v('pf-address'), tenant: v('pf-tenant'), dealType: v('pf-dealtype'),
      status: v('pf-status'), signDate: v('pf-signdate'), periodStart: v('pf-start'), periodEnd: v('pf-end'), depositDate: v('pf-depositdate'),
      rent: Number(v('pf-rent'))||0, deposit: v('pf-deposit')?Number(v('pf-deposit')):null, serviceFee: v('pf-servicefee')?Number(v('pf-servicefee')):null,
      bank: v('pf-bank'), account: v('pf-account'), accountHolder: v('pf-accountholder'), note: v('pf-note'),
      vacantSince: v('pf-status')==='vacant' ? (v('pf-vacantsince')||null) : null
    };
    if(modalCtx.type === 'addProperty'){
      properties.push({ id: nextPropId++, ...data, rentRecords: [], repairRecords: [], todos: [] });
    } else {
      const p = getProp(modalCtx.propId);
      Object.assign(p, data);
    }
  }
  else if(modalCtx.type === 'rent'){
    const p = getProp(modalCtx.propId);
    const month = v('rf-month');
    if(!month){ alert('請輸入收款月份'); return; }
    const data = {
      month, rent: Number(v('rf-rent'))||0, serviceFee: v('rf-servicefee')?Number(v('rf-servicefee')):null,
      status: v('rf-status'), note: v('rf-note')
    };
    if(modalCtx.editIndex!=null) p.rentRecords[modalCtx.editIndex] = data;
    else p.rentRecords.unshift(data);
  }
  else if(modalCtx.type === 'repair'){
    const p = getProp(modalCtx.propId);
    const item = v('rpf-item');
    if(!item){ alert('請輸入維修項目'); return; }
    const data = { item, reported: v('rpf-reported'), done: v('rpf-done'), cost: v('rpf-cost')?Number(v('rpf-cost')):null, status: v('rpf-status') };
    if(modalCtx.editIndex!=null) p.repairRecords[modalCtx.editIndex] = data;
    else p.repairRecords.unshift(data);
  }
  else if(modalCtx.type === 'todo'){
    const p = getProp(modalCtx.propId);
    const text = v('tf-text');
    if(!text){ alert('請輸入任務內容'); return; }
    p.todos.unshift({ text, priority: v('tf-priority'), done:false });
  }
  else if(modalCtx.type === 'reportMonth'){
    const year = v('rm-year');
    const monthNum = v('rm-monthnum');
    if(!year || !monthNum){ alert('請選擇年份與月份'); return; }
    const month = year + '/' + String(monthNum).padStart(2,'0');
    if(monthlyReports.some(r=>r.month===month)){ alert('這個月份已經建立過了，請直接切換查看'); return; }
    const newReport = { id: nextReportId++, month, staff: [] };
    monthlyReports.push(newReport);
    currentReportId = newReport.id;
  }
  else if(modalCtx.type === 'staffName'){
    const name = v('sn-name');
    if(!name){ alert('請輸入姓名'); return; }
    const report = getReport(modalCtx.reportId);
    if(modalCtx.staffId){
      const staff = getStaff(report, modalCtx.staffId);
      staff.name = name;
    } else {
      report.staff.push({ id: nextStaffId++, name, items: [] });
    }
  }
  else if(modalCtx.type === 'reportItem'){
    const report = getReport(modalCtx.reportId);
    const staff = getStaff(report, modalCtx.staffId);
    const propId = v('ri-prop') ? Number(v('ri-prop')) : null;
    const propName = v('ri-propname');
    const amount = v('ri-amount');
    if(!propId && !propName){ alert('請選擇物件或輸入物件名稱'); return; }
    if(amount === ''){ alert('請輸入金額'); return; }
    const data = { propId, propName: propId ? null : propName, note: v('ri-note'), amount: Number(amount) };
    if(modalCtx.itemId){
      const idx = staff.items.findIndex(i=>i.id===modalCtx.itemId);
      staff.items[idx] = { ...data, id: modalCtx.itemId };
    } else {
      staff.items.push({ ...data, id: nextItemId++ });
    }
  }

  closeModal();
  refreshAll();
}

document.getElementById('modal-overlay').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

// ═══════════════════════════════ INIT ═══════════════════════════════
loadData();
</script>
</body>
</html>
